# 在真实的 Windows 电脑上构建并自检免安装便携包
# - 手动触发、或推送 packaging/ 等文件时：构建并上传为“构建产物”（Actions 页面下载，保留 30 天）
# - 推送 v 开头的标签时：另外发布到 Releases 页面（标签带“-”的为预发布）
# - 手动触发时填了“发布版本号”（如 v0.1.0-pre）：也发布到 Releases，并在当前提交上自动建这个标签
name: 构建 Windows 便携包

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "发布版本号（如 v0.1.0-pre；留空只构建不发布）"
        required: false
        default: ""
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:
      - "packaging/**"
      - "requirements.txt"
      - ".github/workflows/build-windows-portable.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: 构建便携包并自检
        shell: pwsh
        run: ./packaging/windows/build_portable.ps1 -PythonVersion 3.11.9 -Version "${{ env.RELEASE_TAG != '' && env.RELEASE_TAG || 'dev' }}"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: tiandu-portable-win64
          path: dist/tiandu-portable-win64-*.zip
          retention-days: 30
          compression-level: 0

      - name: 发布到 Releases
        if: startsWith(env.RELEASE_TAG, 'v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: dist/tiandu-portable-win64-*.zip
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          body_path: packaging/windows/RELEASE_NOTES.md
