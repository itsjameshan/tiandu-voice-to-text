# 每次推送和 Pull Request 都在 Windows 和 Linux 上自动跑测试
name: 自动测试

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      GRADIO_ANALYTICS_ENABLED: "False"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 缓存模型
        uses: actions/cache@v4
        with:
          path: |
            models/*.onnx
            models/*.wav
            models/sherpa-onnx-*
          key: models-${{ runner.os }}-${{ hashFiles('pipeline/models.py', 'models/download_models.py') }}

      - name: 安装依赖
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: 下载模型（已缓存的会跳过）
        run: python models/download_models.py

      - name: 代码检查
        run: ruff check .

      - name: 运行测试
        run: pytest -q
