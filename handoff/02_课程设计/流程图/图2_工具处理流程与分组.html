<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>图2_工具处理流程与分组</title>
<style>
 body{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;background:#fff;margin:24px}
 svg{max-width:760px;width:100%}
 .c-teal rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}
 .c-gray rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}
 .th{font-size:14px;font-weight:600;fill:#2C2C2A}
 .ts{font-size:12px;fill:#5F5E5A}
 .arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
</style></head><body><svg width="100%" viewBox="0 0 680 720" role="img"><title>投诉录音整理工具处理流程</title><desc>从上传录音到人工复核共八步，标出每一步由教师模板、哪个学生小组或处理人员负责。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-gray">
<rect x="170" y="20" width="340" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="39" text-anchor="middle" dominant-baseline="central">上传录音或视频</text>
<text class="ts" x="340" y="57" text-anchor="middle" dominant-baseline="central">统一转 16k 单声道 · 教师模板</text>
</g>
<line x1="340" y1="78" x2="340" y2="100" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal">
<rect x="170" y="104" width="340" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="123" text-anchor="middle" dominant-baseline="central">降噪与语音端点检测</text>
<text class="ts" x="340" y="141" text-anchor="middle" dominant-baseline="central">第 1 组 · 第 2 组测远距离</text>
</g>
<line x1="340" y1="162" x2="340" y2="184" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal">
<rect x="170" y="188" width="340" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="207" text-anchor="middle" dominant-baseline="central">语音识别与热词</text>
<text class="ts" x="340" y="225" text-anchor="middle" dominant-baseline="central">基线由教师模板 · 热词第 5 组</text>
</g>
<line x1="340" y1="246" x2="340" y2="268" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal">
<rect x="170" y="272" width="340" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="291" text-anchor="middle" dominant-baseline="central">说话人分离</text>
<text class="ts" x="340" y="309" text-anchor="middle" dominant-baseline="central">第 3 组 · 区分导游与游客</text>
</g>
<line x1="340" y1="330" x2="340" y2="352" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal">
<rect x="170" y="356" width="340" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="375" text-anchor="middle" dominant-baseline="central">数字、证号、金额规范化</text>
<text class="ts" x="340" y="393" text-anchor="middle" dominant-baseline="central">第 4 组</text>
</g>
<line x1="340" y1="414" x2="340" y2="436" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal">
<rect x="170" y="440" width="340" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="459" text-anchor="middle" dominant-baseline="central">话术分类（TensorFlow）</text>
<text class="ts" x="340" y="477" text-anchor="middle" dominant-baseline="central">第 6 组 · 第 7 组对比模型</text>
</g>
<line x1="340" y1="498" x2="340" y2="520" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal">
<rect x="170" y="524" width="340" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="543" text-anchor="middle" dominant-baseline="central">时间戳与证据片段导出</text>
<text class="ts" x="340" y="561" text-anchor="middle" dominant-baseline="central">第 8 组 · 兼测误报率</text>
</g>
<line x1="340" y1="582" x2="340" y2="604" class="arr" marker-end="url(#arrow)"/>
<g class="node c-gray">
<rect x="170" y="608" width="340" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="627" text-anchor="middle" dominant-baseline="central">生成核查初稿，人工复核</text>
<text class="ts" x="340" y="645" text-anchor="middle" dominant-baseline="central">投诉处理人员 · 必须</text>
</g>
<rect class="c-teal" x="170" y="686" width="14" height="14" rx="3" stroke-width="0.5"/>
<text class="ts" x="192" y="693" dominant-baseline="central">学生小组负责</text>
<rect class="c-gray" x="320" y="686" width="14" height="14" rx="3" stroke-width="0.5"/>
<text class="ts" x="342" y="693" dominant-baseline="central">教师模板或人工环节</text>
</svg></body></html>
