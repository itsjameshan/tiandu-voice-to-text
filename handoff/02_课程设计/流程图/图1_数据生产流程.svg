<svg xmlns="http://www.w3.org/2000/svg" style="background:#fff" width="100%" viewBox="0 0 680 130" role="img"><style>
 .x{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;background:#fff;margin:24px}
 
 .c-teal rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}
 .c-gray rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}
 .th{font-size:14px;font-weight:600;fill:#2C2C2A}
 .ts{font-size:12px;fill:#5F5E5A}
 .arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
</style><title>数据生产流程</title><desc>写剧本、分条件录音、校对与标注三步由学生小组完成，最后汇入教师统一管理的共享数据池。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-teal">
<rect x="40" y="20" width="135" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="107" y="39" text-anchor="middle" dominant-baseline="central">写剧本</text>
<text class="ts" x="107" y="57" text-anchor="middle" dominant-baseline="central">全员 · 名字虚构</text>
</g>
<line x1="177" y1="48" x2="192" y2="48" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal">
<rect x="195" y="20" width="135" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="262" y="39" text-anchor="middle" dominant-baseline="central">分条件录音</text>
<text class="ts" x="262" y="57" text-anchor="middle" dominant-baseline="central">安静/嘈杂/远距离</text>
</g>
<line x1="332" y1="48" x2="347" y2="48" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal">
<rect x="350" y="20" width="135" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="417" y="39" text-anchor="middle" dominant-baseline="central">校对与标注</text>
<text class="ts" x="417" y="57" text-anchor="middle" dominant-baseline="central">以实际所说为准</text>
</g>
<line x1="487" y1="48" x2="502" y2="48" class="arr" marker-end="url(#arrow)"/>
<g class="node c-gray">
<rect x="505" y="20" width="135" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="572" y="39" text-anchor="middle" dominant-baseline="central">共享数据池</text>
<text class="ts" x="572" y="57" text-anchor="middle" dominant-baseline="central">教师统一管理</text>
</g>
<rect class="c-teal" x="40" y="98" width="14" height="14" rx="3" stroke-width="0.5"/>
<text class="ts" x="62" y="105" dominant-baseline="central">学生小组负责</text>
<rect class="c-gray" x="180" y="98" width="14" height="14" rx="3" stroke-width="0.5"/>
<text class="ts" x="202" y="105" dominant-baseline="central">教师模板或人工环节</text>
</svg>
